<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="הלוגו הרשמי של בתשובה">
  <title>הלוגו של בתשובה</title>
  <style>
    * { box-sizing: border-box; }
    html, body { min-height: 100%; }
    body {
      margin: 0;
      display: grid;
      place-items: center;
      padding: 32px;
      background: #f5f9fc;
      color: #17324d;
      font-family: Arial, sans-serif;
    }
    main {
      width: min(100%, 720px);
      padding: clamp(28px, 6vw, 56px);
      text-align: center;
      background: #fff;
      border-radius: 28px;
      box-shadow: 0 18px 50px rgb(31 84 128 / 14%);
    }
    img {
      display: block;
      width: min(100%, 520px);
      height: auto;
      margin: 0 auto 28px;
      border-radius: 22%;
    }
    h1 {
      margin: 0;
      font-size: clamp(2rem, 7vw, 3.5rem);
    }
  </style>
</head>
<body>
  <main>
    <img src="/flutter_app/icon_source.png" alt="הלוגו של בתשובה" width="1024" height="1024">
    <h1>בתשובה</h1>
  </main>
</body>
</html>
