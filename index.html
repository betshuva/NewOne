  <script>
    window.betshuvaCopyImage = async (imageUrl) => {
      if (!navigator.clipboard?.write || !window.ClipboardItem) {
        return 'הדפדפן אינו תומך בהעתקת תמונות ללוח';
      }
      try {
        const pngPromise = (async () => {
          const response = await fetch(imageUrl, {
            credentials: 'same-origin', cache: 'no-store'
          });
          if (!response.ok) throw new Error('image_load_failed');
          const source = await response.blob();
          const bitmap = await createImageBitmap(source);
          const canvas = document.createElement('canvas');
          canvas.width = bitmap.width;
          canvas.height = bitmap.height;
          canvas.getContext('2d').drawImage(bitmap, 0, 0);
          bitmap.close();
          return await new Promise((resolve, reject) =>
            canvas.toBlob(
              blob => blob ? resolve(blob) : reject(new Error('png_failed')),
              'image/png'
            )
          );
        })();
        await navigator.clipboard.write([
          new ClipboardItem({ 'image/png': pngPromise })
        ]);
        return '';
      } catch (error) {
        const text = String(error?.name || error || '').toLowerCase();
        if (text.includes('notallowed') || text.includes('permission')) {
          return 'הדפדפן חסם גישה ללוח. יש לאפשר הרשאת לוח ולנסות שוב';
        }
        return 'לא ניתן להעתיק את התמונה. נסה לפתוח אותה שוב';
      }
    };

    // Finish removing stale Flutter workers/caches before loading the app.
    // The Firebase worker is kept because it is used for background push.
    window.betshuvaWebReady = (async () => {
      if ('serviceWorker' in navigator) {
        const registrations = await navigator.serviceWorker.getRegistrations();
        await Promise.all(registrations.map(registration => {
          const script = registration.active?.scriptURL ||
              registration.waiting?.scriptURL ||
              registration.installing?.scriptURL || '';
          return script.includes('firebase-messaging-sw.js')
              ? Promise.resolve(true)
              : registration.unregister();
        }));
      }
      if ('caches' in window) {
        const keys = await caches.keys();
        await Promise.all(keys
            .filter(key => !key.toLowerCase().includes('firebase'))
            .map(key => caches.delete(key)));
      }
    })().catch(() => {});
  </script>

  <script>
    const launchShell = document.getElementById('betshuva-launch-shell');
    const launchStatus = document.getElementById('betshuva-launch-status');
    const retryButton = document.getElementById('betshuva-launch-retry');
    const showLaunchError = () => {
      launchStatus.textContent = 'לא ניתן לפתוח את בתשובה כרגע. אפשר לנסות שוב.';
      retryButton.hidden = false;
    };
    retryButton.addEventListener('click', () => window.location.reload());
    const entryScript = document.createElement('script');
    entryScript.src = 'entry-route.js?v=502cce7460d95306';
    entryScript.onerror = showLaunchError;
    entryScript.onload = () => {
      let storedToken;
      try { storedToken = window.localStorage.getItem('flutter.token'); } catch (_) {}
      const standalone = window.matchMedia?.('(display-mode: standalone)').matches ||
          window.navigator.standalone === true;
      const route = window.betshuvaEntryRoute.resolveEntryRoute({
        href: window.location.href, baseHref: document.baseURI, storedToken, standalone
      });
      if (!route.bootApp) { window.location.replace(route.url); return; }
      if (route.url !== window.location.href) window.history.replaceState(null, '', route.url);
      const loader = window.betshuvaEntryRoute.createAppLoader({
        window, document, ready: window.betshuvaWebReady,
        bootstrapSrc: new URL('flutter_bootstrap.js?v=502cce7460d95306', document.baseURI).href,
        onReady: () => { launchShell.hidden = true; },
        onError: showLaunchError
      });
      window.betshuvaReportAppLoadFailure = loader.reportFailure;
      window.betshuvaStartApp = loader.start;
      loader.start().catch(() => {});
    };
    document.body.appendChild(entryScript);
  </script>
