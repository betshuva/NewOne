name: betshuva
description: BETSHUVA Messenger - אפליקציית מסרים לקהילה החרדית
publish_to: 'none'
version: 1.2.24+144

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.2
  socket_io_client: ^2.0.3+1
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  firebase_core: ^3.3.0
  firebase_messaging: ^15.1.0
  flutter_local_notifications: ^17.2.2
  flutter_contacts: ^1.1.7+1
  google_sign_in: ^6.2.1
  geolocator: ^13.0.1
  url_launcher: ^6.3.1
  record: ^5.2.1
  audioplayers: ^6.4.0
  path_provider: ^2.1.5

dependency_overrides:
  record_platform_interface: 1.2.0
  record_web: 1.1.5
  record_android:
    path: third_party/record_android

flutter:
  uses-material-design: true
  assets:
    - icon_source.png
