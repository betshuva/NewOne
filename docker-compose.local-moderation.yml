services:
  local-moderation:
    build:
      context: ./local_moderation
    image: betshuva-local-moderation:1
    ports:
      - "127.0.0.1:5004:5000"
    environment:
      FALCON_NSFW_THRESHOLD: "0.85"
      FALCON_REVIEW_THRESHOLD: "0.50"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
