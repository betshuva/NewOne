name: Build Web

on:
  push:
    branches: [main]
    paths:
      - flutter_app/**
      - scripts/build-web-release.sh
      - .github/workflows/build-web.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.1
          channel: stable
          cache: true

      - name: Build, validate and sync Web
        run: scripts/build-web-release.sh

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A index.html flutter.js flutter_bootstrap.js flutter_service_worker.js main.dart.js manifest.json firebase-messaging-sw.js assets/ canvaskit/ icons/ flutter_app/pubspec.lock
          git diff --cached --quiet && echo "No changes" || \
            git commit -m "build: update web v$(grep '^version:' flutter_app/pubspec.yaml | awk '{print $2}') [skip ci]"
          git push origin HEAD:main
