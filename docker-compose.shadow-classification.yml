services:
  shadow-classification:
    build:
      context: ./shadow_classification
    image: betshuva-shadow-classification:1
    ports:
      - "127.0.0.1:5005:5000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
