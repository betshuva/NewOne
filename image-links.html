<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>תמונות אתר בתשובה</title>
  <style>
    :root { color-scheme: light; --blue:#176fa6; --ink:#123b57; --line:#d8e4eb; --bg:#f4f8fa; }
    * { box-sizing:border-box; }
    body { margin:0; font-family:Arial,sans-serif; color:var(--ink); background:var(--bg); }
    main { width:min(1180px,calc(100% - 28px)); margin:38px auto 60px; }
    header { margin-bottom:24px; }
    h1 { margin:0 0 8px; font-size:clamp(28px,5vw,44px); }
    header p { margin:0; color:#587180; }
    .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(250px,1fr)); gap:18px; }
    article { overflow:hidden; border:1px solid var(--line); border-radius:16px; background:#fff; box-shadow:0 5px 18px #123b5710; }
    .preview { display:flex; align-items:center; justify-content:center; height:210px; padding:12px; background:#eaf2f6; }
    .preview img { width:100%; height:100%; object-fit:contain; border-radius:8px; }
    .content { padding:14px; }
    h2 { min-height:42px; margin:0 0 12px; font-size:17px; }
    .actions { display:flex; gap:8px; }
    a,button { flex:1; border:0; border-radius:9px; padding:10px 8px; font:inherit; font-weight:bold; text-align:center; cursor:pointer; }
    a { color:#fff; background:var(--blue); text-decoration:none; }
    button { color:var(--blue); background:#e8f4fb; }
    button.done { color:#187742; background:#e5f6ec; }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>כל תמונות אתר בתשובה</h1>
      <p>לחיצה על „פתח תמונה” מציגה את הקובץ המקורי. אפשר גם להעתיק את הקישור הישיר.</p>
    </header>
    <section class="grid" id="gallery"></section>
  </main>
  <script>
    const images = [
      ['תמונת Google Play – גרסה 1','google-play-feature-graphic-1024x500.png'],
      ['תמונת Google Play – גרסה 2','google-play-feature-graphic-1024x500-v2.png'],
      ['תמונת Google Play – גרסה 3','google-play-feature-graphic-1024x500-v3.png'],
      ['תמונת Google Play – גרסה 4','google-play-feature-graphic-1024x500-v4.png'],
      ['כרטיס שיתוף ל־WhatsApp','whatsapp-card-v2.jpg'],
      ['צילום מסך – שיחות בטוחות','store-assets/phone-screenshots-he/01-safe-chats.png'],
      ['צילום מסך – סינון תמונות וסרטונים','store-assets/phone-screenshots-he/02-photo-video-filtering.png'],
      ['צילום מסך – הגדרות קבוצה','store-assets/phone-screenshots-he/03-group-settings.png'],
      ['צילום מסך – עזרת AI','store-assets/phone-screenshots-he/04-ai-help.png'],
      ['דגל ישראל ירוק','tmp/israel-flag-green.png'],
      ['סמל האפליקציה – 192','icons/Icon-192.png'],
      ['סמל האפליקציה – 512','icons/Icon-512.png'],
      ['סמל האפליקציה – Maskable 512','icons/Icon-maskable-512.png']
    ];
    const gallery = document.querySelector('#gallery');
    for (const [title,path] of images) {
      const url = new URL(path, location.href).href;
      const card = document.createElement('article');
      card.innerHTML = `<div class="preview"><img loading="lazy" src="${path}" alt="${title}"></div>
        <div class="content"><h2>${title}</h2><div class="actions">
        <a href="${path}" target="_blank" rel="noopener">פתח תמונה</a>
        <button type="button">העתק קישור</button></div></div>`;
      const button = card.querySelector('button');
      button.addEventListener('click', async () => {
        await navigator.clipboard.writeText(url);
        button.textContent = 'הקישור הועתק'; button.classList.add('done');
        setTimeout(() => { button.textContent = 'העתק קישור'; button.classList.remove('done'); }, 1600);
      });
      gallery.append(card);
    }
  </script>
</body>
</html>
